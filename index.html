<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рассвет — перекладка</title>
  <meta name="description" content="Сайт-эксперимент: история в стиле перекладной анимации, которая оживает при прокрутке.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23ffd98a%22/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/window/window-room.webp">
  <link rel="preload" as="image" href="assets/window/window-city.webp">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <!-- Раскадровка — docs/storyboard.md. Каждая сцена собрана в кадре .frame 16:9, который
       накрывает экран (как object-fit: cover), поэтому слои из генераций 16:9 встают
       в сцену по тем же координатам, что и на исходной картинке.
       ?debug в адресе включает маркеры ScrollTrigger и счётчик прогресса сцены. -->
  <div class="progress" aria-hidden="true"><div class="progress__bar"></div></div>

  <main>
    <!-- 1. Окно: наезд камеры сквозь окно -->
    <section class="scene s-window" id="window" data-length="200" aria-label="Окно">
      <div class="frame">
        <div class="camera">
          <img class="layer" src="assets/window/window-city.webp" alt="">
          <img class="layer" src="assets/window/window-room.webp" alt="">
          <div class="hero hero--window">
            <img class="pose" src="assets/hero/hero-back-window.webp" alt="">
          </div>
        </div>
      </div>
      <div class="title">
        <h1>Рассвет</h1>
        <p>Листайте вниз</p>
      </div>
      <div class="fade"></div>
    </section>

    <!-- 2. Улица: горизонтальный параллакс внутри вертикального скролла -->
    <section class="scene s-street" id="street" data-length="300" aria-label="Улица">
      <div class="sky sky--street"></div>
      <div class="strip strip--far"></div>
      <div class="strip strip--near"></div>
      <div class="ground ground--street"></div>
      <div class="hero hero--street">
        <img class="pose" src="assets/hero/hero-walk-a.webp" alt="" loading="lazy">
        <img class="pose" src="assets/hero/hero-walk-b.webp" alt="" loading="lazy">
        <img class="pose" src="assets/hero/hero-walk-c.webp" alt="" loading="lazy">
      </div>
      <div class="strip strip--lamps">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
        <img src="assets/street/street-lamp.webp" alt="" loading="lazy">
      </div>
      <p class="caption">Город ещё спит.</p>
    </section>

    <!-- 3. Опушка: шторка-маска и смена поз -->
    <section class="scene s-edge" id="edge" data-length="200" aria-label="Опушка">
      <div class="sky sky--street"></div>
      <div class="reveal">
        <div class="frame">
          <img class="layer" src="assets/edge/edge-bg.webp" alt="" loading="lazy">
          <div class="hero hero--edge">
            <img class="pose" src="assets/hero/hero-back.webp" alt="" loading="lazy">
            <img class="pose" src="assets/hero/hero-three-quarter.webp" alt="" loading="lazy">
            <img class="pose" src="assets/hero/hero-front.webp" alt="" loading="lazy">
            <img class="pose" src="assets/hero/hero-wave.webp" alt="" loading="lazy">
          </div>
        </div>
      </div>
      <p class="caption">У края леса он оглядывается.</p>
    </section>

    <!-- 4. Лес: движение камеры вглубь -->
    <section class="scene s-forest" id="forest" data-length="250" aria-label="Лес">
      <div class="frame">
        <img class="layer l-forest-far" src="assets/forest/forest-far.webp" alt="" loading="lazy">
        <img class="layer l-forest-mid" src="assets/forest/forest-mid.webp" alt="" loading="lazy">
        <div class="hero hero--forest">
          <img class="pose" src="assets/hero/hero-away-a.webp" alt="" loading="lazy">
          <img class="pose" src="assets/hero/hero-away-b.webp" alt="" loading="lazy">
        </div>
        <img class="layer l-forest-front-left" src="assets/forest/forest-front-left.webp" alt="" loading="lazy">
        <img class="layer l-forest-front-right" src="assets/forest/forest-front-right.webp" alt="" loading="lazy">
      </div>
      <p class="caption">Тропа уводит всё глубже.</p>
    </section>

    <!-- 5. Склон: цвет неба по скроллу, диагональ -->
    <section class="scene s-slope" id="slope" data-length="200" aria-label="Склон">
      <div class="sky sky--slope"></div>
      <div class="frame">
        <img class="layer l-slope-hill" src="assets/slope/slope-hill.webp" alt="" loading="lazy">
        <div class="hero hero--slope">
          <img class="pose" src="assets/hero/hero-climb-a.webp" alt="" loading="lazy">
          <img class="pose" src="assets/hero/hero-climb-b.webp" alt="" loading="lazy">
        </div>
      </div>
      <p class="caption">Небо начинает светлеть.</p>
    </section>

    <!-- 6. Рассвет: солнце, свет, отъезд и крупный план -->
    <section class="scene s-dawn" id="dawn" data-length="250" aria-label="Рассвет">
      <div class="frame">
        <div class="camera">
          <div class="sky sky--dawn"></div>
          <div class="sun"></div>
          <img class="layer" src="assets/dawn/dawn-hills.webp" alt="" loading="lazy">
          <img class="layer" src="assets/dawn/dawn-summit.webp" alt="" loading="lazy">
          <div class="hero hero--dawn">
            <img class="pose" src="assets/hero/hero-summit.webp" alt="" loading="lazy">
          </div>
        </div>
      </div>
      <div class="light"></div>
      <div class="closeup">
        <img src="assets/hero/hero-face-closeup.webp" alt="Лицо героя в свете рассвета" loading="lazy">
      </div>
      <p class="caption">И тогда встаёт солнце.</p>
    </section>

    <!-- 7. Финал: без анимации -->
    <section class="s-final" id="final" aria-label="Финал">
      <h2>Рассвет</h2>
      <p>Эксперимент со скроллителлингом в стиле перекладки: вырезанные фигуры, слои и камера, которыми управляет прокрутка.</p>
      <p><a href="https://github.com/baslie/perekladka">Как это сделано</a></p>
    </section>
  </main>

  <div class="hud" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="js/main.js?v=3" defer></script>
</body>
</html>
